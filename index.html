<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06152f">
  <meta name="description" content="爱创艺，以文字、视觉与教学设计，让想法成为看得见的作品。生有涯，艺无涯。">
  <title>爱创艺｜生有涯，艺无涯</title>
  <link rel="icon" type="image/png" sizes="256x256" href="site-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" as="image" href="logo-solid.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="爱创艺首页"><img src="logo-solid.png" alt="爱创艺"></a>
    <nav aria-label="主导航">
      <a href="#what">做什么</a>
      <a href="#work">作品</a>
      <a href="#contact">聊聊想法 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-light" aria-hidden="true"></div>
      <div class="hero-grain" aria-hidden="true"></div>
      <div class="hero-inner">
        <div class="hero-copy in-view">
          <h1 id="hero-title">生有涯，<br><em>艺无涯。</em></h1>
          <p class="hero-sub">让想法，有自己的形状。</p>
          <a class="hero-link" href="#film">继续看 <span aria-hidden="true">↘</span></a>
        </div>
        <div class="hero-art" aria-label="爱创艺标志">
          <div class="hero-aura"></div>
          <div class="hero-disc">
            <img src="logo-solid.png" alt="爱创艺完整标志">
            <span class="hero-sheen" aria-hidden="true"></span>
          </div>
          <span class="hero-spark spark-a"></span>
          <span class="hero-spark spark-b"></span>
          <span class="hero-spark spark-c"></span>
        </div>
      </div>
      <div class="hero-floor" aria-hidden="true"></div>
    </section>

    <section class="film chapter" id="film" aria-label="爱创艺标志影片">
      <div class="film-stage reveal-media">
        <video class="motion-film" autoplay muted playsinline loop preload="metadata" poster="logo-original-cropped.png" aria-label="爱创艺完整标志动画合集">
          <source src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/brand-reel.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <section class="statement chapter" aria-labelledby="statement-title">
      <div class="statement-halo" aria-hidden="true"></div>
      <div class="statement-mark" aria-hidden="true"><img src="logo-solid.png" alt=""></div>
      <div class="statement-copy reveal">
        <h2 id="statement-title">好创意，<br>会自己说话。</h2>
      </div>
    </section>

    <section class="services chapter" id="what" aria-labelledby="what-title">
      <div class="chapter-heading reveal">
        <h2 id="what-title">把想法，做出来。</h2>
      </div>
      <div class="service-list">
        <article class="service-row reveal">
          <h3>文字与内容</h3>
          <p>文案 · 文章 · 品牌表达</p>
          <span class="service-arrow" aria-hidden="true">↗</span>
        </article>
        <article class="service-row reveal">
          <h3>视觉与图文</h3>
          <p>海报 · 图片 · 版面设计</p>
          <span class="service-arrow" aria-hidden="true">↗</span>
        </article>
        <article class="service-row reveal">
          <h3>教学与课件</h3>
          <p>教学设计 · PPT · 微课</p>
          <span class="service-arrow" aria-hidden="true">↗</span>
        </article>
      </div>
    </section>

    <section class="feature chapter" aria-labelledby="feature-title">
      <div class="feature-copy reveal">
        <h2 id="feature-title">让第一眼，<br>停留久一点。</h2>
      </div>
      <div class="feature-images">
        <img class="feature-back reveal-media" src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/portrait-art.webp" alt="职业头像整理作品画面" loading="lazy">
        <img class="feature-front reveal-media" src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/layers-art.webp" alt="《里层》作品画面" loading="lazy">
      </div>
    </section>

    <section class="work chapter" id="work" aria-labelledby="work-title">
      <div class="chapter-heading reveal">
        <h2 id="work-title">作品，比介绍更诚实。</h2>
      </div>
      <div class="gallery" aria-label="爱创艺作品选">
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/sea-page.webp" alt="《海的一页》创意海报" loading="lazy"><figcaption>把海，折进这一页。</figcaption></figure>
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/entry.webp" alt="《入口》创意海报" loading="lazy"><figcaption>留白，也是入口。</figcaption></figure>
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/woven.webp" alt="《编在一起》创意海报" loading="lazy"><figcaption>把不同，编在一起。</figcaption></figure>
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/complete.webp" alt="《完整》创意海报" loading="lazy"><figcaption>合在一起，才完整。</figcaption></figure>
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/linked.webp" alt="《相连》创意海报" loading="lazy"><figcaption>看似分开，始终相连。</figcaption></figure>
        <figure><img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/endless.webp" alt="《未止》创意海报" loading="lazy"><figcaption>不止于此。</figcaption></figure>
      </div>
    </section>

    <section class="retouch chapter" aria-labelledby="retouch-title">
      <div class="retouch-copy reveal">
        <h2 id="retouch-title">少一点干扰。<br>多一点喜欢。</h2>
      </div>
      <div class="retouch-photo reveal-media">
        <span class="retouch-aura" aria-hidden="true"></span>
        <img src="https://aichuangyi-studio-2026.fabled-ibex-4522.chatgpt.site/media/retouch-art.webp" alt="照片杂物消除与画面整理作品" loading="lazy">
      </div>
    </section>

    <section class="contact chapter" id="contact" aria-labelledby="contact-title">
      <div class="contact-glow" aria-hidden="true"></div>
      <div class="contact-inner reveal">
        <h2 id="contact-title">你的想法，<br>轮到它出场了。</h2>
        <p>从你找到我们的地方，给爱创艺发来一句话。</p>
        <img src="logo-solid.png" alt="爱创艺">
      </div>
    </section>
  </main>
  <footer><span>爱创艺</span><span>生有涯，艺无涯。</span></footer>
  <script src="site.js" defer></script>
</body>
</html>
